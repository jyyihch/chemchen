  <!-- 幾何流動與大小呼吸縮放的三角動畫腳本 -->
  <script>
    (function () {
      const canvas = document.getElementById('triangle-canvas');
      const ctx = canvas.getContext('2d');

      let width = 0;
      let height = 0;
      let triangles = [];

      // 三角形色彩庫 (帶有微透明度的青、藍、紫、亮金)
      const colorPalettes = [
        'rgba(45, 212, 191, ',  // Teal
        'rgba(56, 189, 248, ',  // Sky
        'rgba(129, 140, 248, ', // Indigo
        'rgba(167, 139, 250, ', // Purple
        'rgba(52, 211, 153, ',  // Emerald
      ];

      // 根據螢幕尺寸初始化三角形粒子數量
      function initTriangles() {
        triangles = [];
        // 動態計算適應螢幕密度的數量 (手機 ~25，桌機 ~45)
        const count = Math.min(50, Math.max(22, Math.floor((width * height) / 28000)));

        for (let i = 0; i < count; i++) {
          const baseRadius = Math.random() * 28 + 14; // 基礎半徑 14px ~ 42px
          triangles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            baseRadius: baseRadius,
            // 縮放變化振幅
            scaleAmp: Math.random() * 0.5 + 0.35, 
            // 呼吸頻率相位
            pulsePhase: Math.random() * Math.PI * 2,
            pulseSpeed: Math.random() * 0.02 + 0.008,
            // 漂移速度
            vx: (Math.random() - 0.5) * 0.55,
            vy: (Math.random() - 0.5) * 0.55,
            // 旋轉
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.012,
            // 外觀與顏色
            colorBase: colorPalettes[Math.floor(Math.random() * colorPalettes.length)],
            alpha: Math.random() * 0.22 + 0.08,
            isFilled: Math.random() > 0.35, // 部分實心，部分幾何線條
            strokeWidth: Math.random() * 1.5 + 1
          });
        }
      }

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initTriangles();
      }

      window.addEventListener('resize', resize);
      resize();

      // 繪製正三角形核心函式
      function drawTriangle(x, y, radius, rotation, colorBase, alpha, isFilled, strokeWidth) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);

        ctx.beginPath();
        // 三頂點座標 (極坐標系生成 120 度均勻頂點)
        for (let i = 0; i < 3; i++) {
          const angle = (i * 2 * Math.PI) / 3 - Math.PI / 2;
          const px = radius * Math.cos(angle);
          const py = radius * Math.sin(angle);
          if (i === 0) {
            ctx.moveTo(px, py);
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.closePath();

        if (isFilled) {
          ctx.fillStyle = `${colorBase}${alpha})`;
          ctx.fill();
        } else {
          ctx.strokeStyle = `${colorBase}${alpha * 1.4})`;
          ctx.lineWidth = strokeWidth;
          ctx.stroke();
        }

        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < triangles.length; i++) {
          const t = triangles[i];

          // 1. 位置流動更新
          t.x += t.vx;
          t.y += t.vy;

          // 2. 自轉更新
          t.rotation += t.rotSpeed;

          // 3. 呼吸縮放 (變大變小)：利用正弦波平滑縮放
          t.pulsePhase += t.pulseSpeed;
          const scaleFactor = 1 + t.scaleAmp * Math.sin(t.pulsePhase);
          const currentRadius = t.baseRadius * scaleFactor;

          // 4. 邊界平滑包裹處理 (超越邊界時從另一側進入)
          const padding = currentRadius * 2;
          if (t.x < -padding) t.x = width + padding;
          if (t.x > width + padding) t.x = -padding;
          if (t.y < -padding) t.y = height + padding;
          if (t.y > height + padding) t.y = -padding;

          // 5. 繪製三角形
          drawTriangle(
            t.x,
            t.y,
            currentRadius,
            t.rotation,
            t.colorBase,
            t.alpha,
            t.isFilled,
            t.strokeWidth
          );
        }

        requestAnimationFrame(animate);
      }

      // 啟動動畫
      requestAnimationFrame(animate);
    })();
  </script>
