<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休倒數</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: #fff;
    background: #111827;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 動畫特效背景 */
  .background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(139,92,246,.45), transparent 32%),
      radial-gradient(circle at 80% 30%, rgba(59,130,246,.35), transparent 30%),
      radial-gradient(circle at 50% 90%, rgba(236,72,153,.28), transparent 35%),
      linear-gradient(135deg, #111827, #312e81 50%, #111827);
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(3px);
    opacity: .5;
    animation: float 12s ease-in-out infinite alternate;
  }
  .orb:nth-child(1) {
    width: 280px; height: 280px;
    background: #8b5cf6;
    left: 5%; top: 10%;
  }
  .orb:nth-child(2) {
    width: 220px; height: 220px;
    background: #06b6d4;
    right: 8%; top: 15%;
    animation-delay: -4s;
  }
  .orb:nth-child(3) {
    width: 330px; height: 330px;
    background: #ec4899;
    left: 35%; bottom: -15%;
    animation-delay: -7s;
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 1.5px);
    background-size: 70px 70px;
    animation: drift 25s linear infinite;
    opacity: .25;
  }

  @keyframes float {
    from { transform: translate3d(-30px,-20px,0) scale(1); }
    to   { transform: translate3d(40px,30px,0) scale(1.15); }
  }
  @keyframes drift {
    from { transform: translate(0,0); }
    to   { transform: translate(70px,70px); }
  }

  .container {
    position: relative;
    z-index: 2;
    width: min(92vw, 900px);
    text-align: center;
  }

  .calendar {
    width: min(360px, 75vw);
    margin: 0 auto 34px;
    border-radius: 24px;
    overflow: hidden;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
    backdrop-filter: blur(16px);
  }

  .calendar-head {
    padding: 14px;
    background: rgba(255,255,255,.16);
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 700;
    letter-spacing: 2px;
  }

  .calendar-body {
    padding: 28px 20px 30px;
  }

  .date {
    font-size: clamp(34px, 7vw, 58px);
    font-weight: 800;
    line-height: 1.1;
    text-shadow: 0 4px 20px rgba(0,0,0,.3);
  }

  .weekday {
    margin-top: 12px;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 600;
  }

  .countdown-label {
    font-size: clamp(25px, 5vw, 42px);
    font-weight: 700;
    margin-bottom: 12px;
    text-shadow: 0 4px 20px rgba(0,0,0,.3);
  }

  .days {
    font-size: clamp(72px, 15vw, 150px);
    line-height: .95;
    font-weight: 900;
    letter-spacing: -4px;
    background: linear-gradient(180deg, #fff, #ddd6fe);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 10px 35px rgba(0,0,0,.2);
  }

  .unit {
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 700;
    margin-top: 12px;
  }

  .retire-date {
    margin-top: 20px;
    font-size: 15px;
    opacity: .72;
  }

  #fullscreenBtn {
    margin-top: 30px;
    border: 0;
    border-radius: 999px;
    padding: 14px 28px;
    color: white;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(10px);
    cursor: pointer;
    font-size: 17px;
    font-weight: 700;
    transition: .25s;
  }
  #fullscreenBtn:hover {
    transform: translateY(-2px) scale(1.03);
    background: rgba(255,255,255,.25);
  }

  .fullscreen-mode .container {
    transform: scale(1.04);
  }

  @media (max-height: 650px) {
    .calendar { margin-bottom: 14px; }
    .calendar-body { padding: 15px; }
    #fullscreenBtn { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="background">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="stars"></div>
</div>

<main class="container">
  <section class="calendar" aria-label="今日日期">
    <div class="calendar-head" id="yearMonth">----</div>
    <div class="calendar-body">
      <div class="date" id="date">--月--日</div>
      <div class="weekday" id="weekday">禮拜--</div>
    </div>
  </section>

  <section>
    <div class="countdown-label">距離退休還有</div>
    <div class="days" id="days">0</div>
    <div class="unit">天</div>
    <div class="retire-date">退休日期：2029年8月1日</div>
  </section>

  <button id="fullscreenBtn" type="button">⛶ 全螢幕顯示</button>
</main>

<script>
  const retirementDate = new Date(2029, 7, 1); // 2029/8/1，月份從0開始

  const weekdayNames = ["日", "一", "二", "三", "四", "五", "六"];

  function startOfDay(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
  }

  function update() {
    const now = new Date();

    document.getElementById("yearMonth").textContent =
      `${now.getFullYear()}年`;

    document.getElementById("date").textContent =
      `${now.getMonth() + 1}月${now.getDate()}日`;

    document.getElementById("weekday").textContent =
      `禮拜${weekdayNames[now.getDay()]}`;

    const today = startOfDay(now);
    const retirement = startOfDay(retirementDate);
    const msPerDay = 24 * 60 * 60 * 1000;

    // 以「日期」計算，避免夏令時間造成天數誤差。
    const remaining = Math.max(0, Math.ceil((retirement - today) / msPerDay));

    document.getElementById("days").textContent =
      remaining.toLocaleString("zh-TW");
  }

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        document.body.classList.add("fullscreen-mode");
      } else {
        await document.exitFullscreen();
      }
    } catch (e) {
      alert("此瀏覽器不允許全螢幕模式，請使用瀏覽器的全螢幕功能。");
    }
  }

  document.getElementById("fullscreenBtn").addEventListener("click", toggleFullscreen);

  document.addEventListener("fullscreenchange", () => {
    const active = !!document.fullscreenElement;
    document.body.classList.toggle("fullscreen-mode", active);
    document.getElementById("fullscreenBtn").textContent =
      active ? "⛶ 離開全螢幕" : "⛶ 全螢幕顯示";
  });

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
